<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>深空 · 太阳系</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden;
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #scene { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #scene.drag { cursor: grabbing; }

  #hud { position: fixed; left: 22px; top: 20px; color: #dfe8f4; font-size: 12px;
    letter-spacing: .02em; user-select: none; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.7); transition: opacity .3s; z-index: 5; }
  #hud .title { font-size: 16px; font-weight: 600; letter-spacing: .18em; opacity: .95; }
  #hud .sub { font-size: 10px; letter-spacing: .3em; color: #8fa3c0; margin-top: 3px; }
  #hud .grid { display: grid; grid-template-columns: auto auto; gap: 3px 16px; opacity: .85;
    margin-top: 12px; font-variant-numeric: tabular-nums; }
  #hud .grid span:nth-child(odd) { color: #7e93b4; }
  body.nohud #hud, body.nohud #bar, body.nohud #info, body.nohud #credits,
  body.nohud #hint, body.nohud #labels { opacity: 0 !important; pointer-events: none !important; }

  /* 底部控制条 */
  #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 6;
    user-select: none; transition: opacity .3s; }
  #bar .row { display: flex; gap: 6px; align-items: center; padding: 7px 10px;
    background: rgba(8,12,22,.55); border: 1px solid rgba(150,180,230,.16);
    border-radius: 10px; backdrop-filter: blur(8px); }
  #bar button { padding: 4px 10px; font-size: 11.5px; color: #dfe8f4; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(150,180,230,.18);
    border-radius: 6px; font-family: inherit; letter-spacing: .03em; white-space: nowrap; }
  #bar button:hover { background: rgba(140,180,255,.18); }
  #bar button.on { background: rgba(120,170,255,.28); border-color: rgba(150,190,255,.5); color: #fff; }
  #bar .sep { width: 1px; height: 16px; background: rgba(150,180,230,.2); margin: 0 3px; }
  #bar .lbl { font-size: 10.5px; color: #7e93b4; letter-spacing: .08em; }
  #speed { font-size: 11px; color: #ffd9a0; min-width: 74px; text-align: center;
    font-variant-numeric: tabular-nums; }

  /* 天体信息面板 */
  #info { position: fixed; right: 20px; top: 20px; width: 252px; padding: 14px 16px;
    color: #e6edf7; background: rgba(8,12,22,.6); border: 1px solid rgba(150,180,230,.18);
    border-radius: 10px; backdrop-filter: blur(8px); z-index: 6; font-size: 12px;
    user-select: none; transition: opacity .35s, transform .35s; }
  #info.hide { opacity: 0; transform: translateX(14px); pointer-events: none; }
  #info h2 { margin: 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: .1em; }
  #info .en { font-size: 10px; letter-spacing: .24em; color: #8fa3c0; margin-bottom: 10px; }
  #info .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
    font-variant-numeric: tabular-nums; margin-bottom: 10px; }
  #info .kv span:nth-child(odd) { color: #7e93b4; }
  #info .desc { font-size: 11.5px; line-height: 1.65; color: #b9c6da; }
  #info .close { position: absolute; right: 10px; top: 8px; cursor: pointer; color: #7e93b4;
    font-size: 14px; padding: 2px 6px; }
  #info .close:hover { color: #fff; }

  /* 天体标签 */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  #labels .tag { position: absolute; transform: translate(-50%, -140%); padding: 2px 8px;
    font-size: 11px; letter-spacing: .12em; color: #cfe0f5; white-space: nowrap;
    background: rgba(8,14,26,.45); border: 1px solid rgba(150,180,230,.22);
    border-radius: 4px; pointer-events: auto; cursor: pointer;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); transition: opacity .2s; }
  #labels .tag:hover { background: rgba(120,170,255,.3); color: #fff; }
  #labels .tag::after { content: ""; position: absolute; left: 50%; top: 100%;
    width: 1px; height: 9px; background: rgba(150,180,230,.4); }

  #hint { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .1em; color: rgba(200,215,240,.5); z-index: 5;
    pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.8); transition: opacity 1s; }
  #credits { position: fixed; right: 16px; bottom: 14px; font-size: 10px; z-index: 5;
    color: rgba(150,170,200,.45); letter-spacing: .04em; text-align: right;
    pointer-events: none; line-height: 1.6; }
  #credits a { color: rgba(150,170,200,.6); pointer-events: auto; }

  #load { position: fixed; inset: 0; display: grid; place-content: center; z-index: 20;
    background: #04060c; color: #9fb4d4; font-size: 12px; letter-spacing: .3em;
    transition: opacity .8s; }
  #load.gone { opacity: 0; pointer-events: none; }
  #load .ring { width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%;
    border: 2px solid rgba(150,180,230,.15); border-top-color: #7ea6e8;
    animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #err { position: fixed; inset: 0; display: none; place-content: center; padding: 40px;
    color: #ffb4a0; background: #0c0808; font: 13px/1.6 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; overflow: auto; z-index: 30; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="title">深空 · 太阳系</div>
  <div class="sub">DEEP SPACE · SOLAR SYSTEM</div>
  <div class="grid">
    <span>模拟日期</span><span id="hDate">—</span>
    <span>时间流速</span><span id="hSpeed">—</span>
    <span>聚焦</span><span id="hFocus">全景</span>
    <span>帧率</span><span id="hFps">—</span>
  </div>
</div>

<div id="info" class="hide">
  <span class="close" id="infoClose">✕</span>
  <h2 id="iName">—</h2>
  <div class="en" id="iEn">—</div>
  <div class="kv" id="iKv"></div>
  <div class="desc" id="iDesc"></div>
</div>

<div id="bar">
  <div class="row" id="navRow"></div>
  <div class="row">
    <button id="btnPause" title="空格">⏸</button>
    <button id="btnSlower">−</button>
    <span id="speed">2 天/秒</span>
    <button id="btnFaster">＋</button>
    <div class="sep"></div>
    <button id="btnOrbits" class="on">轨道</button>
    <button id="btnLabels" class="on">标签</button>
    <button id="btnHome">全景</button>
  </div>
</div>

<div id="labels"></div>
<div id="hint">拖动旋转 · 滚轮缩放 · 点击天体聚焦 · Esc 返回全景</div>
<div id="credits">
  行星贴图 © Solar System Scope · <a href="https://www.solarsystemscope.com/textures/" target="_blank">CC BY 4.0</a><br>
  three.js r185 · 几何与大气均为程序化生成
</div>
<div id="load"><div><div class="ring"></div>正在展开星图 …</div></div>
<div id="err"></div>

<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('err');
  el.style.display = 'grid';
  el.textContent = 'RUNTIME ERROR\n\n' + (e.error && e.error.stack || e.message);
  document.title = 'ERR: ' + e.message;
});
</script>

</html>
